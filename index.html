<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milthm 视频制谱</title>
<style>body{margin:0;background:#101523;color:#e9efff;font:15px system-ui}main{max-width:1150px;margin:32px auto;padding:20px}h1{font-size:28px}p{color:#a8b6d0}section{background:#1a2336;padding:18px;border-radius:14px;margin:16px 0}button,input,select{font:inherit;color:inherit;background:#26354f;border:1px solid #435576;padding:9px;border-radius:7px}button{cursor:pointer}button:hover{background:#3a5075}a{color:#92dbef}label{display:inline-block;margin:8px}video{width:100%;display:block}#stage{position:relative}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#status{white-space:pre-wrap;color:#8cdbbd}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:5px;border-bottom:1px solid #33405b}td input{width:90px}#rows{max-height:360px;overflow:auto}.hint{font-size:13px}</style>
<main><h1>Milthm 视频 → 可游玩谱面</h1><p>导入完整播放视频，自动标定流速、追踪移动判定圈、识别全屏音符与假音符，拟合轨道与长条，自动打包谱面、音频和曲绘为 milplay ZIP。</p>
<section><input id="file" type="file" accept="video/*"><button id="run">全自动还原</button><p class="hint">选择完整播放视频后自动标定、识别并导出；完成报告会列出计数误差和推断项。</p><div id="status">选择完整播放视频开始。</div></section>
<section><button id="direct">下载完整 ZIP</button><a id="reportlink" hidden target="_blank">查看自动识别报告</a><div id="calibration"></div><div id="audit"></div></section><section><div id="stage"><video id="video" controls></video><canvas id="overlay" width="1280" height="720"></canvas></div><label>时间 <input id="seek" type="number" min="0" step="0.033" value="0"></label><button id="jump">跳转</button><button id="add">在当前时间添加音符</button><label>位置 X <input id="newx" type="number" value="640"></label><p class="hint">红圈：可见轨迹候选；黄圈：补检或低置信度；蓝圈：假音符推断。X 使用 1280 宽归一化坐标。视频播放与谱面都从视频第 0 秒计时。</p></section>
<section><details><summary>可选：查看或编辑音符</summary><details><summary>预览参数</summary><label>判定线位置 <input id="judge" type="number" min="0.2" max="0.96" step="0.001" value="0.82361"></label><label>亮度阈值 <input id="threshold" type="number" value="168" min="80" max="245"></label></details><label>标题 <input id="title" value="Video reconstruction"></label><button id="export">导出完整 ZIP</button><button id="json">保存校正 JSON</button><label>载入校正 JSON <input id="load" type="file" accept=".json"></label><label>显示时间窗 <input id="window" type="number" value="5" min="1" max="141"></label><div id="rows"></div></details></section></main>
<script>
let events=[],effects=[],base='',timer;const $=s=>document.getElementById(s),v=$('video'),ctx=$('overlay').getContext('2d');
function status(t){$('status').textContent=t}function safeName(s){return String(s||'milplay').replace(/[^A-Za-z0-9\u4e00-\u9fff_-]+/g,'-').replace(/^-+|-+$/g,'')||'milplay'}function download(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function table(){let now=v.currentTime||0,win=+$('window').value;let visible=events.map((e,i)=>[e,i]).filter(([e])=>Math.abs(e.time-now)<=win);$('rows').innerHTML='<table><tr><th>时间 / 秒</th><th>X</th><th>类型</th><th>长条 / 秒</th><th>判定 Y</th><th>真假 / 证据</th><th></th></tr>'+visible.slice(0,300).map(([e,i])=>`<tr><td><input data-i="${i}" data-k="time" type="number" step="0.001" value="${e.time}"></td><td><input data-i="${i}" data-k="x" type="number" value="${e.x}"></td><td><select data-i="${i}" data-k="type"><option value="0" ${e.type===0?'selected':''}>Tap / Hold</option><option value="1" ${e.type===1?'selected':''}>Drag</option><option value="2" ${e.type===2?'selected':''}>Fracture</option></select></td><td><input data-i="${i}" data-k="duration" type="number" min="0" step="0.001" value="${e.duration}"></td><td><input data-i="${i}" data-k="judgeY" type="number" step="0.001" min="0" max="1" value="${e.judgeY??+$('judge').value}"></td><td>${e.isFake?'假音符推断':'实音符'} / ${e.evidence||e.confidence||'manual'}</td><td><button data-del="${i}">删除</button></td></tr>`).join('')+'</table>'}
$('rows').onchange=e=>{let {i,k}=e.target.dataset;if(i!==undefined)events[+i][k]=+e.target.value};$('rows').onclick=e=>{if(e.target.dataset.del!==undefined){events.splice(+e.target.dataset.del,1);table()}};
function draw(){ctx.clearRect(0,0,1280,720);let y=+$('judge').value*720;ctx.strokeStyle='#77e0bd';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1280,y);ctx.stroke();for(let e of events){let dt=e.time-v.currentTime;if(dt<-Math.max(.12,(e.duration||0)+.12)||dt>1.4)continue;let ey=(e.judgeY??+$('judge').value)*720,sy=ey-(e.duration>0?Math.max(0,dt):dt)*(e.speed||950),sx=e.x;
let path=e.path||[],shift=e.time-(e.sourceTime??e.time),xs=e.x-(e.sourceX??e.x),tt=v.currentTime-shift;if(path.length&&tt<path[0][0])continue;
for(let j=0;j+1<path.length;j++){let a=path[j],b=path[j+1];if(a[0]<=tt&&tt<=b[0]){let k=(tt-a[0])/(b[0]-a[0]);sx=a[1]+(b[1]-a[1])*k+xs;sy=a[2]+(b[2]-a[2])*k;break}}ctx.strokeStyle=e.isFake?'#72dafa':e.confidence==='low'||e.confidence==='inferred'?'#ffcf72':'#ff7777';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,24,0,Math.PI*2);ctx.stroke();if(e.duration>0){ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy-e.duration*(e.speed||950));ctx.stroke()}}requestAnimationFrame(draw)}draw();v.ontimeupdate=()=>{$('seek').value=v.currentTime.toFixed(3);table()};$('jump').onclick=()=>{v.currentTime=+$('seek').value;table()};$('window').onchange=table;
$('file').onchange=()=>{let f=$('file').files[0];if(f){v.src=URL.createObjectURL(f);if(!$('title').value||$('title').value==='Video reconstruction')$('title').value=f.name.replace(/\.[^.]+$/,'')}};
async function load(basePath){base=basePath;$('reportlink').href=base+'/report.json';$('reportlink').hidden=false;events=await(await fetch(base+'/events.json')).json();for(let e of events){e.sourceTime??=e.time;e.sourceX??=e.x}table();
$('audit').innerHTML='';effects=[];try{let er=await fetch(base+'/visuals-v2.json');if(er.ok)effects=await er.json();let cr=await fetch(base+'/calibration.json');if(cr.ok){let c=await cr.json();$('judge').value=c.judgeY;$('calibration').textContent=`视频标定流速 ${c.nominalPixelsPerSecondAt1280.toFixed(1)} px/s（1280 宽），${c.segments.length} 个分段；导出自动补偿播放器流速设置。`}}catch{}try{let r=await fetch(base+'/audit.json');if(r.ok){let a=await r.json();$('audit').innerHTML=`<p>视频末尾连击 ${a.videoFinalCombo} · 估计判定 ${a.estimatedJudgements} · 差 ${a.difference}</p><p class="hint">${a.warning}</p><details><summary>逐帧 OCR 候选检查（含识别误差，点击跳转）</summary>`+a.intervals.map(i=>`<button data-audit="${i.from}">${i.from}–${i.to}s：视频 ${i.videoJudgements} / 估计 ${i.estimatedJudgements} / 差 ${i.difference}</button>`).join(' ')+'</details>'}}catch{}status(`已载入 ${events.length} 个候选音符。已自动生成可下载 ZIP；下方编辑器可选。`)}
$('run').onclick=async()=>{let f=$('file').files[0];if(!f)return status('请先选择视频');$('run').disabled=true;status('正在上传…');try{let r=await fetch('/api/upload',{method:'POST',headers:{'X-Judge-Y':$('judge').value,'X-Threshold':$('threshold').value,'X-Title':encodeURIComponent($('title').value||'Video reconstruction')},body:f});let j=await r.json();if(!r.ok)throw Error(j.error);status('逐帧识别中…');timer=setInterval(async()=>{try{let s=await(await fetch('/api/job/'+j.id)).json();if(s.phase)status(s.phase);if(s.state==='done'){clearInterval(timer);$('run').disabled=false;await load(s.base);status(`自动完成：${s.report.visibleCandidates} 个候选 · ${s.report.estimatedRealJudgements} 次实音符判定 · ${s.report.inferredFakeNotes} 个假音符推断 · ${s.report.effectOnlyRepairs} 个特效补检。完整 ZIP 已保存，可以直接下载。${s.report.unresolvedCountDifference?'仍有计数差 '+s.report.unresolvedCountDifference+'，详见报告。':'计数约束已满足；真假与效果仍属推断。'}`);}else if(s.state==='failed'){clearInterval(timer);$('run').disabled=false;status(s.error)}}catch(e){clearInterval(timer);$('run').disabled=false;status(e.message)}},1500)}catch(e){$('run').disabled=false;status(e.message)}};
$('audit').onclick=e=>{if(e.target.dataset.audit!==undefined){v.currentTime=+e.target.dataset.audit;table()}};
$('add').onclick=()=>{events.push({time:v.currentTime,x:+$('newx').value,type:0,duration:0,confidence:'manual'});table()};
$('direct').onclick=async()=>{if(!base)return status('先运行全自动还原');let r=await fetch(base+'/milplay.zip');if(r.ok)download(await r.blob(),safeName($('title').value)+'.zip','application/zip');else status('自动谱面尚未生成')};
$('export').onclick=async()=>{let r=await fetch('/api/export-zip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base,events,effects,title:$('title').value,judgeY:+$('judge').value})});if(r.ok)download(await r.blob(),safeName($('title').value)+'-edited.zip','application/zip');else status(await r.text())};
$('json').onclick=()=>download(JSON.stringify({events,effects,judgeY:+$('judge').value,title:$('title').value},null,2),'corrected.json','application/json');$('load').onchange=async()=>{try{let d=JSON.parse(await $('load').files[0].text());events=d.events||d;effects=d.effects||[];if(!Array.isArray(events))throw Error('需要 events 数组');if(d.judgeY)$('judge').value=d.judgeY;if(d.title)$('title').value=d.title;table()}catch(e){status(e.message)}};
</script></html>
